# Builds a release APK (and AAB) for NoteNest in the cloud, so you don't need
# Flutter/Android tooling on your own machine.
#
# How to use:
#   1. Put this file in the repo at:  .github/workflows/build-apk.yml
#   2. Commit and push. The workflow runs on push, on a version tag, or manually
#      (Actions tab -> "Build NoteNest APK" -> Run workflow).
#   3. When it finishes, open the run and download the artifact
#      "notenest-release-apk" (contains app-release.apk).
#
# No signing secrets are required for sideloading: without a keystore the release
# build falls back to debug signing, which installs fine via `adb install`.
# To produce a Play-Store-ready, properly-signed build, add the four secrets
# named below and uncomment the "Sign" step.

name: Build NoteNest APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # ---- Optional: real signing for Play Store uploads --------------------
      # Create these repository secrets first:
      #   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #   ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      # Then delete the leading '#' from the three steps below.
      #
      # - name: Decode keystore
      #   run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/notenest.jks
      #
      # - name: Write key.properties
      #   run: |
      #     cat > android/key.properties <<EOF
      #     storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      #     keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
      #     keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
      #     storeFile=notenest.jks
      #     EOF
      #
      # - name: Build signed App Bundle
      #   run: flutter build appbundle --release
      # -----------------------------------------------------------------------

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release
        continue-on-error: true

      - name: Verify the APK is real
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$APK"
          test -s "$APK" || (echo "APK is empty!" && exit 1)
          unzip -l "$APK" | head

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notenest-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: notenest-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
